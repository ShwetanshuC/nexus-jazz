name: Auto-deploy to preview

# nexus-jazz is cloned fresh at boot inside shwetanshuc-portfolio's own
# container (see apps/previews there), not tracked via a git submodule
# pointer anymore — so there's no pointer to bump. Every push to main here
# instead directly triggers that repo's "Deploy to Lightsail" workflow,
# which redeploys the currently-built image; entrypoint.sh's boot-time
# clone picks up this new commit automatically. The preview at
# /preview/<slug>/ always tracks main's HEAD — there is no per-commit
# pinning or rollback-to-an-older-commit for previews under this design.

on:
  push:
    branches: [main]

jobs:
  trigger-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger shwetanshuc-portfolio redeploy
        env:
          GH_TOKEN: ${{ secrets.PORTFOLIO_PUSH_TOKEN }}
        run: |
          gh workflow run deploy.yml --repo ShwetanshuC/shwetanshuc-portfolio
